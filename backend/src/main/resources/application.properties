spring.application.name=swiftcart
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/swiftcart?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=root
spring.datasource.password=akkas@2004
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.sql.init.mode=never
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=8MB

app.jwt.secret=${JWT_SECRET:swiftcart-development-secret-change-before-production-123456}
app.jwt.access-token-minutes=30
app.jwt.refresh-token-days=14
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

springdoc.swagger-ui.path=/api/v1/swagger-ui.html
management.endpoints.web.exposure.include=health,info,metrics
