spring.application.name=swiftcart

# Cloud dynamic port binding (Render assigns PORT automatically)
server.port=${PORT:8080}

# Aiven MySQL Cloud Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/swiftcart}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.sql.init.mode=never
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=8MB

# JWT Configuration
app.jwt.secret=${JWT_SECRET:swiftcart-development-secret-change-before-production-123456}
app.jwt.access-token-minutes=30
app.jwt.refresh-token-days=14

# CORS: Allows local dev AND your live Vercel store
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://swift-cart-8iovt3p5z-mohdakkas-projects.vercel.app}

# Actuator & Swagger
springdoc.swagger-ui.path=/api/v1/swagger-ui.html
management.endpoints.web.exposure.include=health,info,metrics

# Razorpay Configuration
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_replace_me}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:replace_me}
razorpay.currency=INR